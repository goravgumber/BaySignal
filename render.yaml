services:
  - type: web
    name: smartpark-server
    env: node
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpark-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://smartpark-client.onrender.com
      - key: TRUST_PROXY
        value: true

  - type: web
    name: smartpark-client
    env: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://smartpark-server.onrender.com/api
      - key: VITE_WS_URL
        value: https://smartpark-server.onrender.com

databases:
  - name: smartpark-db
    plan: free
