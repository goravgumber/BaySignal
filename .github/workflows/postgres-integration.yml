name: PostgreSQL Integration Tests

on:
  pull_request:
    branches:
      - main
      - feature/baysignal-production-implementation
  push:
    branches:
      - feature/baysignal-production-implementation
      - feature/device-auth-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Build client
        run: npm run build
        working-directory: client
      - name: Audit client production dependencies
        run: npm audit --omit=dev
        working-directory: client
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: server
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server
      - name: Audit server production dependencies
        run: npm audit --omit=dev
        working-directory: server
      - name: Run server unit tests
        run: npm run test:unit
        working-directory: server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: raspberry_pi/requirements.txt
      - name: Install Raspberry Pi agent dependencies
        run: python -m pip install -r raspberry_pi/requirements.txt
      - name: Test Raspberry Pi request signing
        run: python -m unittest discover -s raspberry_pi -p 'test_*.py'

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: baysignal_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Verify fresh, adoption, and schema-drift migration paths
        run: npm run test:postgres:migrations
        working-directory: server
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:baysignal_test_only@127.0.0.1:5432/postgres
          BAYSIGNAL_TEST_DB_CONFIRMATION: EPHEMERAL-POSTGRES
      - name: Exercise PostgreSQL constraints, transactions, and tenant routes
        run: npm run test:postgres:integration
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:baysignal_test_only@127.0.0.1:5432/baysignal_test_integration
          JWT_SECRET: integration-test-only-secret-with-at-least-thirty-two-characters
          NODE_ENV: test
          BAYSIGNAL_PG_INTEGRATION: '1'
          BAYSIGNAL_TEST_DB_CONFIRMATION: EPHEMERAL-POSTGRES
